<!-- Supabase → Authentication → Emails → Templates → "Confirm sign up".
     Subject: Your MPS Garden code: {{ .Token }}
     Paste everything below into the message body. -->
<div style="font-family: Arial, Helvetica, sans-serif; background:#06140E; padding:32px 16px;">
  <div style="max-width:420px; margin:0 auto; background:#0B2E1F; border-radius:20px; padding:32px 24px; text-align:center; color:#F2FBF5;">
    <div style="font-size:42px; line-height:1;">🌿</div>
    <h1 style="margin:16px 0 8px; font-size:22px;">Verify your email</h1>
    <p style="margin:0 0 24px; color:#B8CCBF; font-size:15px;">Enter this code in the MPS Garden app to activate your account.</p>
    <div style="display:inline-block; background:#3DDC84; color:#05210F; font-size:32px; font-weight:800; letter-spacing:10px; padding:14px 22px; border-radius:14px;">{{ .Token }}</div>
    <p style="margin:24px 0 0; color:#8FA597; font-size:13px;">The code expires in 1 hour. If you didn't sign up, you can ignore this email.</p>
    <hr style="border:none; border-top:1px solid #1E4A35; margin:24px 0;">
    <p style="margin:0; color:#8FA597; font-size:13px;" dir="rtl">رمز التحقق الخاص بك في تطبيق حديقة MPS: <b style="color:#F2FBF5;">{{ .Token }}</b></p>
  </div>
</div>
